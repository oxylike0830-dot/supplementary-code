name: paper-supp
channels: [conda-forge, defaults]
dependencies:
  - python=3.11
  - numpy=1.26
  - pandas=2.2
  - matplotlib=3.9
  - scipy=1.13
  - pip
  - pip:
      # If you vendor (copy) pymethods into src/, you don't need this.
      # Otherwise, pin to your fork + commit SHA:
      - "pymethods @ git+https://github.com/<YOUR-USERNAME>/pymethods@<COMMIT-SHA>"
      - imageio